name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `rust-embed` requires frontend/dist to exist at compile time. The real
      # UI is built in the frontend job, so a placeholder is enough here.
      - run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>Wayfinder Slate</title>' > frontend/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --check ../scripts/fetch-map-assets.mjs
      - run: node --check ../scripts/build-treasure-objects.mjs
      - run: node --check ../scripts/build-divine-beasts.mjs
      - run: node --check ../scripts/validate-map-objects.mjs
      - run: node ../scripts/validate-map-objects.mjs
      - run: npm run check
      - run: npm run test
      - run: npm run build
