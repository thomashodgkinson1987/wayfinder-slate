[workspace]
resolver = "3"
members = [
    "crates/wayfinder-agent",
    "crates/wayfinder-control",
    "crates/wayfinder-save",
    "crates/wayfinder-server",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
authors = ["Thomas Hodgkinson <thomashodgkinson1987@gmail.com>"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.6"
async-trait = "0.1"
axum = "0.8"
axum-login = "0.18"
binrw = "0.15"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
mime_guess = "2.0"
rmp-serde = "1.1"
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "time"] }
thiserror = "2.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.45", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
tower-sessions = "0.14"
uuid = { version = "1.29", features = ["v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayfinder-control = { path = "crates/wayfinder-control" }
wayfinder-save = { path = "crates/wayfinder-save" }

[profile.release]
lto = "thin"
strip = true
